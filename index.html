<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const A_GRUP_SUPABASE_URL = 'https://ekmqcznrjebiowuaysbe.supabase.co';

const A_GRUP_SUPABASE_KEY = 'sb_publishable_uT7QjXuIQpKbmKFXCfEAPg_egyYi4X0';

const SUPABASE_ANON_KEY = A_GRUP_SUPABASE_KEY;
window.SUPABASE_ANON_KEY = A_GRUP_SUPABASE_KEY;

const A_GRUP_DB = window.supabase.createClient(
  A_GRUP_SUPABASE_URL,
  A_GRUP_SUPABASE_KEY
);


// ======================================================
// QUIZ STATE
// ======================================================

let A_GRUP_QUIZ_STATE = {
  subject: null,
  questions: [],
  index: 0,
  poolSize: 0
};


// ======================================================
// A-GRUP QUIZ
// ======================================================

async function AGrupQuiz(selectedSubject = null, forceNew = false) {

  const quiz = document.getElementById('quiz');

  if (!quiz) return;


  // ====================================================
  // HTML GÜVENLİĞİ
  // ====================================================

  function temiz(value) {

    return String(value ?? '').replace(
      /[&<>"']/g,
      character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[character]
    );

  }


  // ====================================================
  // 1. DERS SEÇİM EKRANI
  // ====================================================

  if (!selectedSubject) {

    A_GRUP_QUIZ_STATE = {
      subject: null,
      questions: [],
      index: 0,
      poolSize: 0
    };


    quiz.innerHTML = `

      <header>

        <div>

          <div class="eyebrow">
            KPSS A GRUBU
          </div>

          <div class="title">
            Soru Çöz
          </div>

          <div class="sub">
            Çalışmak istediğin dersi seç.
          </div>

        </div>

      </header>


      <div class="card">

        <h3 style="margin-top:0;">
          Dersler
        </h3>


        <div
          id="agrupSubjects"
          style="
            display:grid;
            grid-template-columns:
              repeat(auto-fit,minmax(210px,1fr));
            gap:12px;
            margin-top:18px;
          "
        >

          <p class="sub">
            Dersler yükleniyor...
          </p>

        </div>

      </div>

    `;


    // ==================================================
    // DERSLERİ SUPABASE'DEN GETİR
    // ==================================================

    const {
      data: subjects,
      error: subjectsError
    } = await A_GRUP_DB

      .from('subjects')

      .select(
        'id,name'
      )

      .order('id');


    if (subjectsError) {

      document
        .getElementById('agrupSubjects')
        .innerHTML = `

          <div class="ai">

            <b>
              Dersler alınamadı.
            </b>

            <p>
              ${temiz(
                subjectsError.message
              )}
            </p>

          </div>

        `;

      return;

    }


    if (
      !subjects ||
      !subjects.length
    ) {

      document
        .getElementById('agrupSubjects')
        .innerHTML = `

          <div class="ai">

            <b>
              Ders bulunamadı.
            </b>

          </div>

        `;

      return;

    }


    // ==================================================
    // HER DERSİN YAYIMLANMIŞ SORU SAYISI
    // ==================================================

    const subjectsWithCounts =
      await Promise.all(

        subjects.map(
          async subject => {

            const {
              count,
              error: countError
            } = await A_GRUP_DB

              .from('questions')

              .select(
                'id',
                {
                  count: 'exact',
                  head: true
                }
              )

              .eq(
                'subject_id',
                subject.id
              )

              .eq(
                'status',
                'published'
              );


            return {

              ...subject,

              questionCount:
                countError
                  ? 0
                  : (count || 0)

            };

          }
        )

      );


    // ==================================================
    // DERS KARTLARI
    // ==================================================

    document
      .getElementById('agrupSubjects')
      .innerHTML =

      subjectsWithCounts

        .map(
          subject => `

            <button
              type="button"
              class="
                btn
                secondary
                agrupSubjectButton
              "
              data-subject="
                ${temiz(subject.name)}
              "
              style="
                width:100%;
                min-height:68px;
                text-align:left;
              "
            >

              <div
                style="
                  font-weight:700;
                "
              >

                ${temiz(
                  subject.name
                )}

              </div>


              <div
                style="
                  margin-top:6px;
                  font-size:13px;
                  opacity:.70;
                "
              >

                ${subject.questionCount}
                yayımlanmış soru

              </div>

            </button>

          `
        )

        .join('');


    // ==================================================
    // DERS SEÇİM BUTONLARI
    // ==================================================

    document
      .querySelectorAll(
        '.agrupSubjectButton'
      )
      .forEach(
        button => {

          button.onclick =
            event => {

              event.preventDefault();
              event.stopPropagation();

              AGrupQuiz(
                button.dataset.subject.trim(),
                true
              );

            };

        }
      );


    return;

  }


  // ====================================================
  // 2. SEÇİLEN DERSİN QUIZ EKRANI
  // ====================================================

  quiz.innerHTML = `

    <header>

      <div>

        <div
          class="eyebrow"
          id="quizEyebrow"
        >

          ${temiz(
            selectedSubject
          )}

        </div>


        <div class="title">
          Soru Çöz
        </div>


        <div
          class="sub"
          id="agrupInfo"
        >

          Sorular yükleniyor...

        </div>

      </div>


      <div
        style="
          display:flex;
          gap:8px;
          flex-wrap:wrap;
        "
      >

        <button
          type="button"
          class="btn secondary"
          id="agrupBack"
        >

          Ders Değiştir

        </button>


        <button
          type="button"
          class="btn secondary"
          id="agrupRefresh"
        >

          Yeni Sorular

        </button>

      </div>

    </header>


    <div class="card">


      <div class="progress">

        <i
          id="agrupProgress"
          style="width:0%"
        ></i>

      </div>


      <div id="agrupQuestion">

        <p class="sub">

          ${temiz(
            selectedSubject
          )}

          soruları yükleniyor...

        </p>

      </div>


    </div>

  `;


  // ====================================================
  // DERS DEĞİŞTİR
  // ====================================================

  document
    .getElementById('agrupBack')
    .onclick = event => {

      event.preventDefault();
      event.stopPropagation();

      AGrupQuiz();

    };


  // ====================================================
  // YENİ SORULAR
  // ====================================================

  document
    .getElementById('agrupRefresh')
    .onclick = event => {

      event.preventDefault();
      event.stopPropagation();

      AGrupQuiz(
        selectedSubject,
        true
      );

    };


  // ====================================================
  // 3. MEVCUT QUIZ OTURUMU VAR MI?
  // ====================================================

  const canReuseSession =

    !forceNew &&

    A_GRUP_QUIZ_STATE.subject ===
      selectedSubject &&

    A_GRUP_QUIZ_STATE.questions.length > 0;


  // ====================================================
  // 4. YENİ QUIZ GEREKİYORSA SORULARI GETİR
  // ====================================================

  if (!canReuseSession) {


    // ==================================================
    // DERS ID
    // ==================================================

    const {
      data: subject,
      error: subjectError
    } = await A_GRUP_DB

      .from('subjects')

      .select(
        'id,name'
      )

      .eq(
        'name',
        selectedSubject
      )

      .single();


    if (
      subjectError ||
      !subject
    ) {

      document
        .getElementById(
          'agrupQuestion'
        )
        .innerHTML = `

          <div class="ai">

            <b>
              Ders alınamadı.
            </b>

            <p>

              ${temiz(

                subjectError
                  ? subjectError.message
                  : 'Ders bulunamadı.'

              )}

            </p>

          </div>

        `;

      return;

    }


    // ==================================================
    // YAYIMLANMIŞ SORULAR
    // ==================================================

    const {
      data,
      error
    } = await A_GRUP_DB

      .from('questions')

      .select(`

        id,

        question_text,

        option_a,

        option_b,

        option_c,

        option_d,

        option_e,

        correct_answer,

        explanation,

        difficulty,

        topics(name)

      `)

      .eq(
        'subject_id',
        subject.id
      )

      .eq(
        'status',
        'published'
      )

      .limit(1000);


    if (error) {

      document
        .getElementById(
          'agrupQuestion'
        )
        .innerHTML = `

          <div class="ai">

            <b>
              Sorular alınamadı.
            </b>

            <p>
              ${temiz(
                error.message
              )}
            </p>

          </div>

        `;

      return;

    }


    // ==================================================
    // 20 SORULUK QUIZ
    // ==================================================

    const sorular =

      [...(data || [])]

        .sort(
          () =>
            Math.random() - 0.5
        )

        .slice(
          0,
          20
        );


    if (!sorular.length) {

      document
        .getElementById(
          'agrupInfo'
        )
        .textContent =
          selectedSubject;


      document
        .getElementById(
          'agrupQuestion'
        )
        .innerHTML = `

          <div class="ai">

            <b>
              Bu derste yayımlanmış
              soru bulunamadı.
            </b>

            <p>

              Supabase'de bu derse ait

              <b>
                published
              </b>

              durumunda soru bulunmuyor.

            </p>

          </div>

        `;

      return;

    }


    // ==================================================
    // QUIZ STATE
    // ==================================================

    A_GRUP_QUIZ_STATE = {

      subject:
        selectedSubject,

      questions:
        sorular,

      index:
        0,

      poolSize:
        (data || []).length

    };

  }


  // ====================================================
  // 5. SORUYU GÖSTER
  // ====================================================

  function goster() {


    const sorular =
      A_GRUP_QUIZ_STATE.questions;


    const sira =
      A_GRUP_QUIZ_STATE.index;


    const q =
      sorular[sira];


    if (!q) {

      AGrupQuiz(
        selectedSubject,
        true
      );

      return;

    }


    const konu =
      q.topics?.name ||
      'Genel';


    // ==================================================
    // DERS BAŞLIĞI
    // ==================================================

    document
      .getElementById(
        'quizEyebrow'
      )
      .textContent =
        selectedSubject;


    // ==================================================
    // SAYAÇ
    // ==================================================

    const bilgiAlani =
      document.getElementById(
        'agrupInfo'
      );


    if (bilgiAlani) {

      bilgiAlani.innerHTML =

        `<strong>Soru ${
          sira + 1
        } / ${
          sorular.length
        }</strong> · Toplam soru havuzu: ${
          A_GRUP_QUIZ_STATE.poolSize
        } · Konu: ${
          temiz(konu)
        }`;

    }


    // ==================================================
    // İLERLEME ÇUBUĞU
    // ==================================================

    document
      .getElementById(
        'agrupProgress'
      )
      .style.width =

        `${
          (
            (
              sira + 1
            ) /
            sorular.length
          ) * 100
        }%`;


    // ==================================================
    // ŞIKLAR
    // ==================================================

    const secenekler = [

      [
        'A',
        q.option_a
      ],

      [
        'B',
        q.option_b
      ],

      [
        'C',
        q.option_c
      ],

      [
        'D',
        q.option_d
      ],

      [
        'E',
        q.option_e
      ]

    ];


    // ==================================================
    // SORU HTML
    // ==================================================

    document
      .getElementById(
        'agrupQuestion'
      )
      .innerHTML = `


        <div class="question">

          ${temiz(
            q.question_text
          )}

        </div>


        <div id="agrupOptions">


          ${secenekler

            .map(

              (
                [
                  harf,
                  metin
                ]
              ) => `


                <button

                  type="button"

                  class="option"

                  data-answer="
                    ${harf}
                  "

                >


                  <b>
                    ${harf})
                  </b>


                  ${temiz(
                    metin
                  )}


                </button>


              `

            )

            .join('')}


        </div>


        <div

          id="agrupAI"

          class="
            ai
            hidden
          "

        ></div>


      `;


    // ==================================================
    // ŞIK TIKLAMA
    // ==================================================

    document

      .querySelectorAll(
        '#agrupOptions .option'
      )

      .forEach(

        button => {

          button.onclick =
            event => {

              event.preventDefault();
              event.stopPropagation();

              cevapla(
                button,
                q
              );

            };

        }

      );

  }


  // ====================================================
  // 6. CEVABI KONTROL ET
  // ====================================================

  function cevapla(
    button,
    q
  ) {


    const secilen =
      String(
        button.dataset.answer || ''
      )
        .trim()
        .toUpperCase();


    const dogruCevap =
      String(
        q.correct_answer || ''
      )
        .trim()
        .toUpperCase();


    const dogru =
      secilen ===
      dogruCevap;


    // ==================================================
    // ŞIKLARI KİLİTLE
    // ==================================================

    document

      .querySelectorAll(
        '#agrupOptions .option'
      )

      .forEach(

        option => {

          option.disabled =
            true;

        }

      );


    // ==================================================
    // SEÇİLEN ŞIK
    // ==================================================

    button.classList.add(

      dogru
        ? 'correct'
        : 'wrong'

    );


    // ==================================================
    // DOĞRU ŞIK
    // ==================================================

    document

      .querySelectorAll(
        '#agrupOptions .option'
      )

      .forEach(

        option => {

          const optionAnswer =
            String(
              option.dataset.answer || ''
            )
              .trim()
              .toUpperCase();


          if (
            optionAnswer ===
            dogruCevap
          ) {

            option.classList.add(
              'correct'
            );

          }

        }

      );


    // ==================================================
    // AÇIKLAMA
    // ==================================================

    const ai =
      document.getElementById(
        'agrupAI'
      );


    ai.classList.remove(
      'hidden'
    );


    const sonSoru =

      A_GRUP_QUIZ_STATE.index + 1 >=

      A_GRUP_QUIZ_STATE.questions.length;


    ai.innerHTML = `


      <b>

        ${
          dogru

            ? '✅ Doğru!'

            : '❌ Yanlış.'
        }

      </b>


      ${
        !dogru

          ? `

            <p>

              Doğru cevap:

              <b>
                ${temiz(
                  dogruCevap
                )}
              </b>

            </p>

          `

          : ''
      }


      <p>

        ${temiz(

          q.explanation ||

          'Bu soru için açıklama bulunmuyor.'

        )}

      </p>


      <p>


        <span class="pill">

          ${temiz(

            q.topics?.name ||

            'Genel'

          )}

        </span>


        <span class="pill">

          ${temiz(

            q.difficulty ||

            ''

          )}

        </span>


      </p>


      <button

        type="button"

        class="btn"

        id="agrupNext"

      >

        ${
          sonSoru

            ? 'Yeni Quiz'

            : 'Sonraki Soru →'
        }

      </button>


    `;


    // ==================================================
    // 7. SONRAKİ SORU
    // ==================================================

    document
      .getElementById(
        'agrupNext'
      )
      .onclick =
        event => {


          event.preventDefault();

          event.stopPropagation();


          if (

            A_GRUP_QUIZ_STATE.index + 1 <

            A_GRUP_QUIZ_STATE.questions.length

          ) {


            A_GRUP_QUIZ_STATE.index += 1;


            goster();


          } else {


            AGrupQuiz(
              selectedSubject,
              true
            );


          }

        };

  }


  // ====================================================
  // İLK SORU
  // ====================================================

  goster();

}

</script>
